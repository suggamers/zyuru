<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ズュッル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* === トークン === */
    :root {
      --font-display: 'Noto Serif JP', serif;
      --font-body: 'Noto Sans JP', sans-serif;
      --color-bg:             #0c0b12;
      --color-surface:        #131120;
      --color-surface-2:      #1a1828;
      --color-surface-offset: #201e30;
      --color-border:         #2d2a42;
      --color-divider:        #252338;
      --color-text:           #d8d5e8;
      --color-text-muted:     #7a758f;
      --color-text-faint:     #3d3a52;
      --color-primary:        #a78bfa;
      --color-primary-hover:  #c4b5fd;
      --color-primary-dim:    #3d2f6e;
      --color-zowa-glow:      rgba(124,111,224,0.25);
      --color-zowa-intense:   #e879f9;
      --text-xs:   clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm:   clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg:   clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-phrase: clamp(1.75rem, 1rem + 3vw, 3rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
      --radius-sm: 0.375rem; --radius-md: 0.75rem;
      --radius-lg: 1.25rem; --radius-xl: 2rem; --radius-full: 9999px;
      --transition-ui: 180ms cubic-bezier(0.16,1,0.3,1);
    }

    /* === ベース === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: none; text-size-adjust: none; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      overflow-x: hidden;
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

    /* === スクリーン管理 === */
    .screen { display: none; flex-direction: column; min-height: 100dvh; max-width: 480px; margin: 0 auto; padding: var(--space-4); }
    .screen.active { display: flex; }

    /* === タイトル === */
    #screen-title {
      align-items: center; justify-content: center;
      gap: var(--space-6); text-align: center;
      padding: var(--space-8) var(--space-4);
    }
    .title-logo {
      width: min(320px, 90vw);
      color: var(--color-primary);
      filter: drop-shadow(0 0 24px var(--color-zowa-glow));
      animation: float 4s ease-in-out infinite;
    }
    .title-logo svg { width: 100%; height: auto; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .title-sub { font-size: var(--text-sm); color: var(--color-text-muted); letter-spacing: 0.1em; }
    .title-desc { display: flex; flex-direction: column; gap: var(--space-2); max-width: 320px; }
    .title-desc p { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.7; }
    .mode-buttons { display: flex; flex-direction: column; gap: var(--space-3); width: 100%; max-width: 320px; }
    .btn-mode {
      display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
      gap: var(--space-1) var(--space-3); align-items: center;
      padding: var(--space-4) var(--space-6);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); text-align: left;
      transition: background var(--transition-ui), border-color var(--transition-ui), transform var(--transition-ui);
      position: relative; overflow: hidden;
    }
    .btn-mode::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--color-primary) 0%, transparent 60%);
      opacity: 0; transition: opacity var(--transition-ui);
    }
    .btn-mode:hover::before { opacity: 0.06; }
    .btn-mode:hover { border-color: var(--color-primary); transform: translateY(-2px); }
    .btn-mode:active { transform: translateY(0); }
    .mode-icon { grid-row: 1/3; font-size: 1.75rem; line-height: 1; }
    .mode-name { font-size: var(--text-base); font-weight: 700; color: var(--color-text); }
    .mode-desc { font-size: var(--text-xs); color: var(--color-text-muted); }
    .title-note { font-size: var(--text-xs); color: var(--color-text-faint); }
    
    /* 権利表記（VOICEVOX用） */
    .credit {
      text-align: center;
      font-size: 0.65rem;
      color: var(--color-text-faint);
      margin-top: var(--space-6);
    }
    .credit a { color: inherit; text-decoration: underline; }

    /* === ゲームヘッダー === */
    .game-header {
      display: flex; align-items: center; gap: var(--space-3);
      padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-divider);
      margin-bottom: var(--space-4); flex-shrink: 0;
    }
    .btn-back {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: var(--radius-md);
      color: var(--color-text-muted);
      transition: color var(--transition-ui), background var(--transition-ui);
      flex-shrink: 0;
    }
    .btn-back:hover { color: var(--color-text); background: var(--color-surface); }
    .header-center { flex: 1; }
    .mode-label { font-size: var(--text-xs); color: var(--color-text-muted); letter-spacing: 0.08em; }
    .score-display { display: flex; align-items: baseline; gap: var(--space-1); flex-shrink: 0; }
    .score-num { font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); font-variant-numeric: tabular-nums lining-nums; }
    .score-unit { font-size: var(--text-xs); color: var(--color-text-muted); }

    /* === カテゴリタブ === */
    .category-tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 500;
      color: var(--color-text-muted); background: var(--color-surface);
      border: 1px solid var(--color-border);
      transition: all var(--transition-ui); white-space: nowrap;
    }
    .cat-tab:hover { color: var(--color-text); border-color: var(--color-primary-dim); }
    .cat-tab.active { color: var(--color-primary); background: var(--color-primary-dim); border-color: var(--color-primary); }

    /* === フレーズカード === */
    .phrase-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-4) 0; }
    .phrase-card {
      width: 100%; min-height: 220px;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-xl); padding: var(--space-8) var(--space-6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-4); text-align: center; cursor: pointer;
      transition: border-color var(--transition-ui), box-shadow var(--transition-ui), transform var(--transition-ui);
      position: relative; overflow: hidden;
    }
    .phrase-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, var(--color-zowa-glow) 0%, transparent 70%);
      opacity: 0; transition: opacity 600ms ease;
      pointer-events: none;
    }
    .phrase-card.showing::before { opacity: 1; }
    .phrase-card:hover { border-color: var(--color-primary-dim); transform: scale(1.01); }
    .phrase-card:active { transform: scale(0.99); }
    .phrase-card.zowa-flash { border-color: var(--color-primary); box-shadow: 0 0 32px var(--color-zowa-glow); }
    .phrase-hint { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.06em; }
    .phrase-text {
      font-family: var(--font-display); font-size: var(--text-phrase);
      font-weight: 700; color: var(--color-text); line-height: 1.4;
      word-break: break-all; letter-spacing: 0.02em;
    }
    .phrase-card.entering .phrase-text { animation: phraseEnter 500ms cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes phraseEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.96); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .phrase-card-footer { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: var(--space-3); }
    .phrase-type {
      font-size: var(--text-xs); color: var(--color-text-faint);
      padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
      background: var(--color-surface-offset);
    }
    
    /* アクションボタン群のラッパー */
    .footer-actions { display: flex; gap: var(--space-2); align-items: center; }

    /* 音声再生・シェアボタンのスタイル */
    .btn-speak, .btn-share {
      display: flex; align-items: center; gap: var(--space-1);
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
      font-size: var(--text-xs); color: var(--color-text-muted);
      border: 1px solid var(--color-border); background: var(--color-surface-offset);
      transition: all var(--transition-ui); flex-shrink: 0;
      position: relative; z-index: 10;
    }
    .btn-speak:hover { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-dim); }
    
    /* ローディング状態のスタイル */
    .btn-speak.loading { opacity: 0.6; pointer-events: none; animation: speakPulse 1.5s ease-in-out infinite; }
    .btn-speak.speaking { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-dim); animation: speakPulse 800ms ease-in-out infinite; }
    
    .btn-share:hover { color: #d8d5e8; border-color: #d8d5e8; background: rgba(255,255,255,0.1); }

    @keyframes speakPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

    /* === 反応エリア === */
    .reaction-area { display: flex; flex-direction: column; gap: var(--space-3); flex-shrink: 0; animation: fadeUp 300ms ease forwards; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reaction-label { font-size: var(--text-xs); color: var(--color-text-muted); text-align: center; letter-spacing: 0.06em; }
    .reaction-buttons { display: flex; gap: var(--space-3); justify-content: center; }
    .btn-reaction {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-1);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); flex: 1; max-width: 100px;
      transition: all var(--transition-ui);
    }
    .btn-reaction:hover { border-color: var(--color-primary); background: var(--color-surface-2); transform: translateY(-2px); }
    .btn-reaction:active { transform: scale(0.95); }
    .reaction-emoji { font-size: 1.5rem; line-height: 1; }
    .reaction-text { font-size: var(--text-xs); color: var(--color-text-muted); }

    /* === ネクストエリア === */
    .next-area { display: flex; gap: var(--space-3); margin-top: var(--space-4); flex-shrink: 0; }
    .btn-next {
      flex: 1; padding: var(--space-3) var(--space-4);
      background: var(--color-primary); color: #0c0b12;
      border-radius: var(--radius-md); font-weight: 700; font-size: var(--text-sm);
      transition: background var(--transition-ui), transform var(--transition-ui);
    }
    .btn-next:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
    .btn-next:active { transform: scale(0.98); }
    .btn-skip, .btn-secondary {
      padding: var(--space-3) var(--space-4); color: var(--color-text-muted);
      border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm);
      transition: all var(--transition-ui);
    }
    .btn-skip:hover, .btn-secondary:hover { color: var(--color-text); border-color: var(--color-primary-dim); }

    /* === ストリークバー === */
    .streak-bar {
      display: flex; align-items: center; gap: var(--space-3);
      margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
      background: var(--color-surface); border-radius: var(--radius-md);
      border: 1px solid var(--color-divider); flex-shrink: 0;
    }
    .streak-label { font-size: var(--text-xs); color: var(--color-text-faint); }
    .streak-count { font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); font-variant-numeric: tabular-nums; margin-right: auto; }
    .streak-max { font-size: var(--text-xs); color: var(--color-text-faint); }

    /* === 作るモード === */
    .create-stage { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
    .template-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-xl); padding: var(--space-6); cursor: pointer;
      transition: border-color var(--transition-ui), transform var(--transition-ui);
    }
    .template-card:hover { border-color: var(--color-primary-dim); transform: scale(1.01); }
    .template-label, .preview-label { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.08em; margin-bottom: var(--space-2); }
    .template-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--color-text); line-height: 1.6; }
    .slots-area { display: flex; flex-direction: column; gap: var(--space-3); }
    .slot-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .slot-label { font-size: var(--text-xs); color: var(--color-text-muted); }
    .slot-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .slot-chip {
      padding: var(--space-2) var(--space-3); background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: var(--radius-full);
      font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer;
      transition: all var(--transition-ui);
    }
    .slot-chip:hover { color: var(--color-text); border-color: var(--color-primary-dim); }
    .slot-chip.selected { background: var(--color-primary-dim); border-color: var(--color-primary); color: var(--color-primary); font-weight: 600; }
    .preview-card {
      background: var(--color-surface-2); border: 1px solid var(--color-border);
      border-radius: var(--radius-xl); padding: var(--space-6);
      transition: border-color var(--transition-ui);
      position: relative;
    }
    .preview-card.ready { border-color: var(--color-primary-dim); }
    .preview-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); line-height: 1.6; min-height: 2.4em; }
    .preview-text.placeholder { color: var(--color-text-faint); font-weight: 400; }
    .create-actions { display: flex; gap: var(--space-3); flex-shrink: 0; margin-top: var(--space-4); }

    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }

    /* === ぞわっとエフェクト === */
    .zowa-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: flex; align-items: center; justify-content: center; }
    .zowa-ripple { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--color-zowa-intense) 0%, var(--color-primary) 40%, transparent 70%); opacity: 0; transform: scale(0); }
    .zowa-ripple.animate-1 { animation: zowaRipple1 800ms cubic-bezier(0.16,1,0.3,1) forwards; }
    .zowa-ripple.animate-2 { animation: zowaRipple2 1000ms cubic-bezier(0.16,1,0.3,1) forwards; }
    .zowa-ripple.animate-3 { animation: zowaRipple3 1200ms cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes zowaRipple1 { 0% { opacity:.5; transform:scale(.3); } 60% { opacity:.2; transform:scale(3); } 100% { opacity:0; transform:scale(4); } }
    @keyframes zowaRipple2 { 0% { opacity:.6; transform:scale(.2); } 50% { opacity:.3; transform:scale(4); } 100% { opacity:0; transform:scale(6); } }
    @keyframes zowaRipple3 { 0% { opacity:.7; transform:scale(.1); } 40% { opacity:.4; transform:scale(5); } 100% { opacity:0; transform:scale(8); } }
    @keyframes screenShake {
      0%   { transform: translate(0,0) rotate(0deg); }
      15%  { transform: translate(-3px,2px) rotate(-0.5deg); }
      30%  { transform: translate(3px,-2px) rotate(0.5deg); }
      45%  { transform: translate(-2px,3px) rotate(-0.3deg); }
      60%  { transform: translate(2px,-1px) rotate(0.3deg); }
      75%  { transform: translate(-1px,2px) rotate(-0.1deg); }
      90%  { transform: translate(1px,-1px) rotate(0.1deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }
    .shake { animation: screenShake 600ms ease forwards; }
    @keyframes scorePop { 0% { transform:scale(1); } 40% { transform:scale(1.4); color:var(--color-primary-hover); } 100% { transform:scale(1); } }
    .score-pop { animation: scorePop 400ms cubic-bezier(0.16,1,0.3,1); }

    @media (max-width: 360px) {
      .reaction-buttons { gap: var(--space-2); }
      .btn-reaction { padding: var(--space-2) var(--space-3); }
    }
  </style>
</head>
<body>

  <div id="screen-title" class="screen active">
    <div class="title-logo" aria-label="ぞわっと">
      <svg viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <text x="50%" y="78" text-anchor="middle" font-family="'Noto Serif JP',serif" font-weight="900" font-size="72" fill="currentColor" letter-spacing="-2">ズュッル</text>
        <ellipse cx="160" cy="92" rx="140" ry="6" fill="currentColor" opacity="0.08"/>
        <ellipse cx="160" cy="92" rx="100" ry="4" fill="currentColor" opacity="0.06"/>
      </svg>
    </div>
    <p class="title-sub">音列の違和感を楽しむゲーム</p>
    <div class="title-desc">
      <p>気持ち悪いフレーズを自信満々に声に出してみよう。</p>
      <p>首筋から背中にかけての、あの「ぞわっ」を楽しもう。</p>
    </div>
    <div class="mode-buttons">
      <button class="btn-mode" id="btn-read">
        <span class="mode-icon">📖</span>
        <span class="mode-name">読むモード</span>
        <span class="mode-desc">用意された音列を楽しむ</span>
      </button>
      <button class="btn-mode" id="btn-create">
        <span class="mode-icon">✏️</span>
        <span class="mode-name">作るモード</span>
        <span class="mode-desc">造語パーツを組み合わせて作る</span>
      </button>
    </div>
    <p class="title-note">声に出しながら楽しもう。</p>
    
    <div class="credit">
      音声合成: <a href="https://voicevox.hiroshiba.jp/" target="_blank">VOICEVOX (ずんだもん)</a><br>
      API連携: <a href="https://tts.quest/" target="_blank">tts.quest</a>
    </div>
  </div>

  <div id="screen-read" class="screen">
    <header class="game-header">
      <button class="btn-back" id="read-back" aria-label="タイトルに戻る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-center"><span class="mode-label">読むモード</span></div>
      <div class="score-display">
        <span class="score-num" id="read-score">0</span>
        <span class="score-unit">ぞわ</span>
      </div>
    </header>
    <div class="category-tabs">
      <button class="cat-tab active" data-cat="mix">🎲ミックス</button>
      <button class="cat-tab" data-cat="single_sounds">単発</button>
      <button class="cat-tab" data-cat="repeated_sounds">繰り返し</button>
      <button class="cat-tab" data-cat="sound_phrases">フレーズ</button>
      <button class="cat-tab" data-cat="fragments">破片</button>
      <button class="cat-tab" data-cat="manga_sfx">漫画擬音</button>
      <button class="cat-tab" data-cat="niibura">ニーブラ系</button>
      <button class="cat-tab" data-cat="fake_french">假フランス語</button>
    </div>
    <div class="phrase-stage">
      <div class="phrase-card" id="phrase-card">
        <div class="phrase-hint" id="phrase-hint">カードをタップしてスタート</div>
        <div class="phrase-text" id="phrase-text">タップ</div>
        <div class="phrase-card-footer">
          <div class="phrase-type" id="phrase-type"></div>
          <div class="footer-actions">
            <button class="btn-speak" id="btn-speak" style="display:none" aria-label="読み上げる">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <span>聴く</span>
            </button>
            <button class="btn-share" id="btn-share-read" style="display:none" aria-label="Xで叫ぶ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

  // === 音声読み上げ（VOICEVOX 外部API連携版） ===
  let currentAudio = null;
  
  // ★ ここで声の種類を変更できます ★
  // 3: ずんだもん（ノーマル） / 8: 春日部つむぎ / 13: 青山龍星 / 14: 冥鳴ひまり
  const SPEAKER_ID = 3; 

  async function speakText(text, btnElement) {
    if (!text) return;
    
    // 再生中の音声を止める
    stopSpeak();

    if (btnElement) {
      btnElement.classList.add('loading');
      btnElement.querySelector('span').textContent = '生成中...';
    }

    try {
      // tts.questの無料APIを叩く
      const url = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodeURIComponent(text)}&speaker=${SPEAKER_ID}`;
      const res = await fetch(url);
      const data = await res.json();
      
      if (!data.success) {
        throw new Error("APIエラー");
      }

      // 生成されたmp3を再生する
      currentAudio = new Audio(data.mp3DownloadUrl);
      
      currentAudio.onplay = () => {
        if (btnElement) {
          btnElement.classList.remove('loading');
          btnElement.classList.add('speaking');
          btnElement.querySelector('span').textContent = '再生中';
        }
      };
      
      currentAudio.onended = () => {
        if (btnElement) {
          btnElement.classList.remove('speaking');
          btnElement.querySelector('span').textContent = '聴く';
        }
      };
      
      currentAudio.onerror = () => {
        if (btnElement) {
          btnElement.classList.remove('loading', 'speaking');
          btnElement.querySelector('span').textContent = '聴く';
        }
        alert("音声の読み込みに失敗しました。");
      };

      await currentAudio.play();

    } catch (err) {
      console.error(err);
      if (btnElement) {
        btnElement.classList.remove('loading', 'speaking');
        btnElement.querySelector('span').textContent = '聴く';
      }
      alert("通信に失敗しました。無料APIが混み合っている可能性があります。");
    }
  }

  function stopSpeak() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    document.querySelectorAll('.btn-speak').forEach(btn => {
      btn.classList.remove('speaking', 'loading');
      const span = btn.querySelector('span');
      if (span) span.textContent = '聴く';
    });
  }

  });

  const MIX_CATS = ['single_sounds','repeated_sounds','sound_phrases','fragments','manga_sfx','niibura','fake_french'];

  function buildMixQueue() {
    let pools = {};
    MIX_CATS.forEach(cat => { pools[cat] = shuffle([...PHRASES[cat]]); });
    const result = [];
    const counts = {};
    MIX_CATS.forEach(c => counts[c] = pools[c].length);
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    let lastCat = null;
    let remaining = {...counts};

    for (let i = 0; i < total; i++) {
      const available = MIX_CATS.filter(c => remaining[c] > 0 && c !== lastCat);
      if (available.length === 0) break;
      const cat = available[Math.floor(Math.random() * available.length)];
      result.push(pools[cat][--remaining[cat]]);
      lastCat = cat;
    }
    return result.reverse();
  }

    read: { category:'mix', queue:[], score:0, streak:0, maxStreak:0, awaitingReaction:false, current:null },

    const r = state.read;
    if (r.queue.length === 0) r.queue = r.category === 'mix' ? buildMixQueue() : shuffle([...PHRASES[r.category]]);
    const phrase = r.queue.pop();
    r.current = phrase;
    r.awaitingReaction = false;

    const card = $('phrase-card');
    card.classList.remove('entering');
    void card.offsetWidth;
    card.classList.add('showing','entering');

    $('phrase-text').textContent = phrase.text;
    $('phrase-hint').textContent = '声に出して読んでみよう';

    const labels = {single:'単発造語',repeat:'繰り返し',phrase:'造語フレーズ',fragment:'音の破片',manga_sfx:'漫画擬音',niibura:'ニーブラ系',fake_french:'假フランス語',mix:'ミックス'};
    $('phrase-type').textContent = labels[phrase.type] || '';

    const speakBtn = $('btn-speak');
    const shareBtn = $('btn-share-read');
    speakBtn.style.display = 'flex';
    shareBtn.style.display = 'flex';
    speakBtn.dataset.phrase = phrase.text;
    shareBtn.dataset.phrase = phrase.text;
    stopSpeak();

    setTimeout(() => {
      $('reaction-area').style.display = 'flex';
      r.awaitingReaction = true;
    }, 600);
  }

  document.querySelectorAll('#reaction-area .btn-reaction').forEach(btn => {
    btn.onclick = () => {
      const val = parseInt(btn.dataset.val);
      const r = state.read;
      r.score += val * (r.current.intensity || 1);
      $('read-score').textContent = r.score;
      $('read-score').classList.remove('score-pop');
      void $('read-score').offsetWidth;
      $('read-score').classList.add('score-pop');
      if (val >= 2) { r.streak++; if (r.streak > r.maxStreak) r.maxStreak = r.streak; }
      else r.streak = 0;
      $('streak-count').textContent = r.streak;
      $('streak-max').textContent = '最高 ' + r.maxStreak;
      triggerZowa(val);
      $('reaction-area').style.display = 'none';
      r.awaitingReaction = false;
      $('phrase-card').classList.add('zowa-flash');
      setTimeout(() => $('phrase-card').classList.remove('zowa-flash'), 800);
    };
  });

  $('btn-next-read').onclick = () => { $('reaction-area').style.display='none'; nextPhrase(); };
  $('btn-skip-read').onclick = () => {
    $('reaction-area').style.display='none';
    state.read.streak=0; $('streak-count').textContent=0;
    nextPhrase();
  };

  // === 作るモード ===
  function initCreate() {
    state.create.templateIndex = -1;
    state.create.selections = {};
    nextTemplate();
    $('create-reaction-area').style.display = 'none';
    $('btn-speak-create').style.display = 'none';
    $('btn-share-create').style.display = 'none';
  }

  function nextTemplate() {
    const c = state.create;
    const templates = PHRASES.templates;
    c.templateIndex = (c.templateIndex + 1) % templates.length;
    c.current = templates[c.templateIndex];
    c.selections = {};
    $('template-text').textContent = c.current.template;
    stopSpeak();
    renderSlots();
    updatePreview();
  }

  function renderSlots() {
    const c = state.create;
    const area = $('slots-area');
    area.innerHTML = '';
    const slotLabels = {sound_a:'パーツA',sound_b:'パーツB'};
    c.current.slots.forEach((slotType, idx) => {
      const group = document.createElement('div');
      group.className = 'slot-group';
      const label = document.createElement('p');
      label.className = 'slot-label';
      label.textContent = (idx+1) + '. ' + (slotLabels[slotType] || slotType);
      group.appendChild(label);
      const chips = document.createElement('div');
      chips.className = 'slot-chips';
      (SLOT_SUGGESTIONS[slotType] || []).forEach(word => {
        const chip = document.createElement('button');
        chip.className = 'slot-chip';
        chip.textContent = word;
        chip.dataset.slot = idx;
        chip.dataset.word = word;
        chip.onclick = () => {
          chips.querySelectorAll('.slot-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          c.selections[idx] = word;
          updatePreview();
          triggerZowa(1);
        };
        chips.appendChild(chip);
      });
      group.appendChild(chips);
      area.appendChild(group);
    });
  }

  function updatePreview() {
    const c = state.create;
    let text = c.current.template;
    let allFilled = true;
    c.current.slots.forEach((_, idx) => {
      if (c.selections[idx]) text = text.replace('___', c.selections[idx]);
      else allFilled = false;
    });
    
    const el = $('preview-text');
    const card = $('preview-card');
    const speakBtn = $('btn-speak-create');
    const shareBtn = $('btn-share-create');
    
    if (Object.keys(c.selections).length === 0) {
      el.textContent = '—— 上から選んで完成させよう ——';
      el.classList.add('placeholder');
      card.classList.remove('ready');
      speakBtn.style.display = 'none';
      shareBtn.style.display = 'none';
      $('create-reaction-area').style.display = 'none';
    } else {
      el.textContent = text;
      el.classList.remove('placeholder');
      if (allFilled) { 
        card.classList.add('ready'); 
        $('create-reaction-area').style.display = 'flex';
        speakBtn.style.display = 'flex';
        shareBtn.style.display = 'flex';
        speakBtn.dataset.phrase = text;
        shareBtn.dataset.phrase = text;
      } else { 
        card.classList.remove('ready'); 
        $('create-reaction-area').style.display = 'none';
        speakBtn.style.display = 'none';
        shareBtn.style.display = 'none';
      }
    }
  }

  $('btn-new-template').onclick = () => { $('create-reaction-area').style.display='none'; nextTemplate(); };
  $('btn-shuffle-slots').onclick = () => {
    const c = state.create;
    c.current.slots.forEach((slotType, idx) => {
      const sugs = SLOT_SUGGESTIONS[slotType] || [];
      if (sugs.length) c.selections[idx] = sugs[Math.floor(Math.random()*sugs.length)];
    });
    document.querySelectorAll('.slot-chip').forEach(chip => {
      chip.classList.toggle('selected', c.selections[parseInt(chip.dataset.slot)] === chip.dataset.word);
    });
    updatePreview();
    triggerZowa(1);
  };

  document.querySelectorAll('.create-react').forEach(btn => {
    btn.onclick = () => {
      const val = parseInt(btn.dataset.val);
      state.create.score += val * 2;
      $('create-score').textContent = state.create.score;
      $('create-score').classList.remove('score-pop');
      void $('create-score').offsetWidth;
      $('create-score').classList.add('score-pop');
      triggerZowa(val);
      $('create-reaction-area').style.display = 'none';
      $('btn-speak-create').style.display = 'none';
      $('btn-share-create').style.display = 'none';
      setTimeout(() => nextTemplate(), 1200);
    };
  });

  // === ぞわっとエフェクト ===
  function triggerZowa(intensity) {
    const ripple = $('zowa-ripple');
    ripple.classList.remove('animate-1','animate-2','animate-3');
    void ripple.offsetWidth;
    ripple.classList.add('animate-'+intensity);
    if (intensity >= 3) {
      document.body.classList.remove('shake');
      void document.body.offsetWidth;
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 700);
    }
    setTimeout(() => ripple.classList.remove('animate-1','animate-2','animate-3'), 1500);
  }
  </script>
</body>
</html>
