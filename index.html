*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: none; text-size-adjust: none; -webkit-font-smoothing: antialiased; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background: var(--color-bg);
  overflow-x: hidden;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

.screen { display: none; flex-direction: column; min-height: 100dvh; max-width: 480px; margin: 0 auto; padding: var(--space-4); }
.screen.active { display: flex; }

/* === タイトル === */
#screen-title { align-items: center; justify-content: center; gap: var(--space-6); text-align: center; padding: var(--space-8) var(--space-4); }
.title-logo { width: min(320px, 90vw); color: var(--color-primary); filter: drop-shadow(0 0 24px var(--color-zowa-glow)); animation: float 4s ease-in-out infinite; }
.title-logo svg { width: 100%; height: auto; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.title-sub { font-size: var(--text-sm); color: var(--color-text-muted); letter-spacing: 0.1em; }
.title-desc { display: flex; flex-direction: column; gap: var(--space-2); max-width: 320px; }
.title-desc p { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.7; }
.mode-buttons { display: flex; flex-direction: column; gap: var(--space-3); width: 100%; max-width: 320px; }
.btn-mode {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
  gap: var(--space-1) var(--space-3); align-items: center;
  padding: var(--space-4) var(--space-6);
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); text-align: left;
  transition: background var(--transition-ui), border-color var(--transition-ui), transform var(--transition-ui);
  position: relative; overflow: hidden;
}
.btn-mode::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--color-primary) 0%, transparent 60%); opacity: 0; transition: opacity var(--transition-ui); }
.btn-mode:hover::before { opacity: 0.06; }
.btn-mode:hover { border-color: var(--color-primary); transform: translateY(-2px); }
.btn-mode:active { transform: translateY(0); }
.mode-icon { grid-row: 1/3; font-size: 1.75rem; line-height: 1; }
.mode-name { font-size: var(--text-base); font-weight: 700; color: var(--color-text); }
.mode-desc { font-size: var(--text-xs); color: var(--color-text-muted); }
.title-note { font-size: var(--text-xs); color: var(--color-text-faint); }

/* === ゲームヘッダー === */
.game-header { display: flex; align-items: center; gap: var(--space-3); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-divider); margin-bottom: var(--space-4); flex-shrink: 0; }
.btn-back { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius-md); color: var(--color-text-muted); transition: color var(--transition-ui), background var(--transition-ui); flex-shrink: 0; }
.btn-back:hover { color: var(--color-text); background: var(--color-surface); }
.header-center { flex: 1; }
.mode-label { font-size: var(--text-xs); color: var(--color-text-muted); letter-spacing: 0.08em; }
.score-display { display: flex; align-items: baseline; gap: var(--space-1); flex-shrink: 0; }
.score-num { font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); font-variant-numeric: tabular-nums lining-nums; }
.score-unit { font-size: var(--text-xs); color: var(--color-text-muted); }

/* === カテゴリタブ === */
.category-tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.category-tabs::-webkit-scrollbar { display: none; }
.cat-tab { flex-shrink: 0; padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 500; color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-border); transition: all var(--transition-ui); white-space: nowrap; }
.cat-tab:hover { color: var(--color-text); border-color: var(--color-primary-dim); }
.cat-tab.active { color: var(--color-primary); background: var(--color-primary-dim); border-color: var(--color-primary); }

/* === フレーズカード === */
.phrase-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-4) 0; }
.phrase-card {
  width: 100%; min-height: 220px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-xl); padding: var(--space-8) var(--space-6);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-4); text-align: center; cursor: pointer;
  transition: border-color var(--transition-ui), box-shadow var(--transition-ui), transform var(--transition-ui);
  position: relative; overflow: hidden;
}
.phrase-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, var(--color-zowa-glow) 0%, transparent 70%); opacity: 0; transition: opacity 600ms ease; }
.phrase-card.showing::before { opacity: 1; }
.phrase-card:hover { border-color: var(--color-primary-dim); transform: scale(1.01); }
.phrase-card:active { transform: scale(0.99); }
.phrase-card.zowa-flash { border-color: var(--color-primary); box-shadow: 0 0 32px var(--color-zowa-glow); }
.phrase-hint { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.06em; }
.phrase-text { font-family: var(--font-display); font-size: var(--text-phrase); font-weight: 700; color: var(--color-text); line-height: 1.4; word-break: break-all; letter-spacing: 0.02em; }
.phrase-card.entering .phrase-text { animation: phraseEnter 500ms cubic-bezier(0.16,1,0.3,1) forwards; }
@keyframes phraseEnter { from { opacity: 0; transform: translateY(12px) scale(0.96); filter: blur(4px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
.phrase-card-footer { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: var(--space-3); }
.phrase-type { font-size: var(--text-xs); color: var(--color-text-faint); padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); background: var(--color-surface-offset); }
.btn-speak { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3); border-radius: var(--radius-full); font-size: var(--text-xs); color: var(--color-text-muted); border: 1px solid var(--color-border); background: var(--color-surface-offset); transition: all var(--transition-ui); flex-shrink: 0; }
.btn-speak:hover { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-dim); }
.btn-speak.speaking { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-dim); animation: speakPulse 800ms ease-in-out infinite; }
@keyframes speakPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

/* === 反応エリア === */
.reaction-area { display: flex; flex-direction: column; gap: var(--space-3); flex-shrink: 0; animation: fadeUp 300ms ease forwards; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.reaction-label { font-size: var(--text-xs); color: var(--color-text-muted); text-align: center; letter-spacing: 0.06em; }
.reaction-buttons { display: flex; gap: var(--space-3); justify-content: center; }
.btn-reaction { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-3) var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); flex: 1; max-width: 100px; transition: all var(--transition-ui); }
.btn-reaction:hover { border-color: var(--color-primary); background: var(--color-surface-2); transform: translateY(-2px); }
.btn-reaction:active { transform: scale(0.95); }
.reaction-emoji { font-size: 1.5rem; line-height: 1; }
.reaction-text { font-size: var(--text-xs); color: var(--color-text-muted); }

/* === ネクストエリア === */
.next-area { display: flex; gap: var(--space-3); margin-top: var(--space-4); flex-shrink: 0; }
.btn-next { flex: 1; padding: var(--space-3) var(--space-4); background: var(--color-primary); color: #0c0b12; border-radius: var(--radius-md); font-weight: 700; font-size: var(--text-sm); transition: background var(--transition-ui), transform var(--transition-ui); }
.btn-next:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
.btn-next:active { transform: scale(0.98); }
.btn-skip, .btn-secondary { padding: var(--space-3) var(--space-4); color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm); transition: all var(--transition-ui); }
.btn-skip:hover, .btn-secondary:hover { color: var(--color-text); border-color: var(--color-primary-dim); }

/* === ストリークバー === */
.streak-bar { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); padding: var(--space-3) var(--space-4); background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-divider); flex-shrink: 0; }
.streak-label { font-size: var(--text-xs); color: var(--color-text-faint); }
.streak-count { font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); font-variant-numeric: tabular-nums; margin-right: auto; }
.streak-max { font-size: var(--text-xs); color: var(--color-text-faint); }

/* === 作るモード === */
.create-stage { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
.template-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-6); transition: border-color var(--transition-ui), transform var(--transition-ui); }
.template-label, .preview-label { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.08em; margin-bottom: var(--space-2); }
.template-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--color-text); line-height: 1.6; }
.slots-area { display: flex; flex-direction: column; gap: var(--space-3); }
.slot-group { display: flex; flex-direction: column; gap: var(--space-2); }
.slot-label { font-size: var(--text-xs); color: var(--color-text-muted); }
.slot-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.slot-chip { padding: var(--space-2) var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; transition: all var(--transition-ui); }
.slot-chip:hover { color: var(--color-text); border-color: var(--color-primary-dim); }
.slot-chip.selected { background: var(--color-primary-dim); border-color: var(--color-primary); color: var(--color-primary); font-weight: 600; }
.preview-card { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-6); transition: border-color var(--transition-ui); }
.preview-card.ready { border-color: var(--color-primary-dim); }
.preview-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); line-height: 1.6; min-height: 2.4em; }
.preview-text.placeholder { color: var(--color-text-faint); font-weight: 400; }
.create-actions { display: flex; gap: var(--space-3); flex-shrink: 0; margin-top: var(--space-4); }

/* === ぞわっとエフェクト === */
.zowa-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: flex; align-items: center; justify-content: center; }
.zowa-ripple { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--color-zowa-intense) 0%, var(--color-primary) 40%, transparent 70%); opacity: 0; transform: scale(0); }
.zowa-ripple.animate-1 { animation: zowaRipple1 800ms cubic-bezier(0.16,1,0.3,1) forwards; }
.zowa-ripple.animate-2 { animation: zowaRipple2 1000ms cubic-bezier(0.16,1,0.3,1) forwards; }
.zowa-ripple.animate-3 { animation: zowaRipple3 1200ms cubic-bezier(0.16,1,0.3,1) forwards; }
@keyframes zowaRipple1 { 0% { opacity:.5; transform:scale(.3); } 60% { opacity:.2; transform:scale(3); } 100% { opacity:0; transform:scale(4); } }
@keyframes zowaRipple2 { 0% { opacity:.6; transform:scale(.2); } 50% { opacity:.3; transform:scale(4); } 100% { opacity:0; transform:scale(6); } }
@keyframes zowaRipple3 { 0% { opacity:.7; transform:scale(.1); } 40% { opacity:.4; transform:scale(5); } 100% { opacity:0; transform:scale(8); } }
@keyframes screenShake {
  0%   { transform: translate(0,0) rotate(0deg); }
  15%  { transform: translate(-3px,2px) rotate(-0.5deg); }
  30%  { transform: translate(3px,-2px) rotate(0.5deg); }
  45%  { transform: translate(-2px,3px) rotate(-0.3deg); }
  60%  { transform: translate(2px,-1px) rotate(0.3deg); }
  75%  { transform: translate(-1px,2px) rotate(-0.1deg); }
  90%  { transform: translate(1px,-1px) rotate(0.1deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}
.shake { animation: screenShake 600ms ease forwards; }
@keyframes scorePop { 0% { transform:scale(1); } 40% { transform:scale(1.4); color:var(--color-primary-hover); } 100% { transform:scale(1); } }
.score-pop { animation: scorePop 400ms cubic-bezier(0.16,1,0.3,1); }

@media (max-width: 360px) {
  .reaction-buttons { gap: var(--space-2); }
  .btn-reaction { padding: var(--space-2) var(--space-3); }
}

      <button class="btn-secondary" id="btn-shuffle-slots">パーツをシャッフル</button>
    </div>
  </div>

  <div class="zowa-overlay" aria-hidden="true">
    <div class="zowa-ripple" id="zowa-ripple"></div>
  </div>

  <script>
  // ============================================================
  // フレーズデータ
  // ============================================================
  const PHRASES = {
    single_sounds: [
      {text:"サピーン",type:"single",intensity:2},{text:"ズュッ",type:"single",intensity:3},
      {text:"ニュヴァ",type:"single",intensity:3},{text:"ピャキ",type:"single",intensity:2},
      {text:"ズッキャ",type:"single",intensity:2},{text:"ゲュム",type:"single",intensity:3},
      {text:"シュヴァッ",type:"single",intensity:2},{text:"ヌォ",type:"single",intensity:3},
      {text:"ジュワキ",type:"single",intensity:2},{text:"ビュヴ",type:"single",intensity:3},
      {text:"ズォッ",type:"single",intensity:3},{text:"ピュギャ",type:"single",intensity:3},
      {text:"ゲニャ",type:"single",intensity:2},{text:"ヌャッ",type:"single",intensity:3},
      {text:"スュク",type:"single",intensity:3},{text:"ジョヴィ",type:"single",intensity:2},
      {text:"ブュン",type:"single",intensity:2},{text:"ゾュッ",type:"single",intensity:3},
      {text:"ペュキ",type:"single",intensity:3},{text:"ニュキャ",type:"single",intensity:2},
      {text:"ズィッ",type:"single",intensity:3},{text:"グャム",type:"single",intensity:2},
      {text:"シュポヴ",type:"single",intensity:3},{text:"ヴュク",type:"single",intensity:3},
      {text:"ヌェッ",type:"single",intensity:3},
    ],
    repeated_sounds: [
      {text:"サピーンサピーン",type:"repeat",intensity:3},{text:"ズッキャズッキャ",type:"repeat",intensity:3},
      {text:"ニュヴァニュヴァ",type:"repeat",intensity:3},{text:"ピャキピャキ",type:"repeat",intensity:2},
      {text:"ゲュムゲュム",type:"repeat",intensity:3},{text:"ヌォヌォ",type:"repeat",intensity:3},
      {text:"ジュワキジュワキ",type:"repeat",intensity:2},{text:"ズォッズォッ",type:"repeat",intensity:3},
      {text:"ピュギャピュギャ",type:"repeat",intensity:3},{text:"ゲニャゲニャ",type:"repeat",intensity:2},
      {text:"スュクスュク",type:"repeat",intensity:3},{text:"ブュンブュン",type:"repeat",intensity:2},
      {text:"ヴュクヴュク",type:"repeat",intensity:3},{text:"ゾュッゾュッ",type:"repeat",intensity:3},
      {text:"グャムグャム",type:"repeat",intensity:3},
    ],
    sound_phrases: [
      {text:"ニュヴァがサピーンした",type:"phrase",intensity:3},
      {text:"ズッキャのヌォ感",type:"phrase",intensity:3},
      {text:"ピャキッとゲュムる",type:"phrase",intensity:3},
      {text:"スュクなジュワキ",type:"phrase",intensity:2},
      {text:"ゾュッとヌャッた瞬間",type:"phrase",intensity:3},
      {text:"ビュヴいてもヴュクい",type:"phrase",intensity:3},
      {text:"ペュキのグャム感がすごい",type:"phrase",intensity:3},
      {text:"シュヴァッてブュンだから",type:"phrase",intensity:3},
      {text:"ゲニャくてズォッとする",type:"phrase",intensity:3},
      {text:"ヌォのニュキャ加減",type:"phrase",intensity:2},
      {text:"ズュッはズュッなんだよ",type:"phrase",intensity:3},
      {text:"サピーン的なピュギャさ",type:"phrase",intensity:3},
      {text:"ゲュムりながらスュクった",type:"phrase",intensity:3},
      {text:"ヌャッとジョヴィる感じ",type:"phrase",intensity:3},
      {text:"ズィッなのかヌォなのか",type:"phrase",intensity:2},
      {text:"ニュヴァってグャムじゃん",type:"phrase",intensity:3},
      {text:"ブュンのあとのシュポヴ",type:"phrase",intensity:3},
      {text:"ヴュクくてもゾュッでしょ",type:"phrase",intensity:3},
      {text:"ピャキがゲニャになった",type:"phrase",intensity:2},
      {text:"ジュワキ味のズッキャ感",type:"phrase",intensity:3},
    ],
    fragments: [
      {text:"ズュ",type:"fragment",intensity:3},{text:"ヌォ",type:"fragment",intensity:3},
      {text:"ギュヴ",type:"fragment",intensity:3},{text:"ズィ",type:"fragment",intensity:3},
      {text:"ニュヴ",type:"fragment",intensity:3},{text:"ヴュ",type:"fragment",intensity:3},
      {text:"ゲュ",type:"fragment",intensity:3},{text:"スュ",type:"fragment",intensity:3},
      {text:"ペュ",type:"fragment",intensity:3},{text:"ゾュ",type:"fragment",intensity:3},
      {text:"ビュヴ",type:"fragment",intensity:3},{text:"ヌャ",type:"fragment",intensity:3},
      {text:"グャ",type:"fragment",intensity:3},{text:"ヴョ",type:"fragment",intensity:3},
      {text:"ジュヴ",type:"fragment",intensity:3},
    ],
    niibura: [
      {text:"ニーブラ",type:"niibura",intensity:2},{text:"ムベロ",type:"niibura",intensity:2},
      {text:"ダコーン",type:"niibura",intensity:2},{text:"ペニャコ",type:"niibura",intensity:3},
      {text:"ゾベラ",type:"niibura",intensity:2},{text:"ヌベック",type:"niibura",intensity:3},
      {text:"チョビル",type:"niibura",intensity:2},{text:"メコナ",type:"niibura",intensity:2},
      {text:"ブペロ",type:"niibura",intensity:3},{text:"ダニュコ",type:"niibura",intensity:2},
      {text:"ゴムレ",type:"niibura",intensity:2},{text:"ペロジン",type:"niibura",intensity:3},
      {text:"ニョベラ",type:"niibura",intensity:3},{text:"ドゥバコ",type:"niibura",intensity:2},
      {text:"ムゴン",type:"niibura",intensity:2},{text:"ベコナリ",type:"niibura",intensity:2},
      {text:"ゾニュム",type:"niibura",intensity:3},{text:"チュベロ",type:"niibura",intensity:2},
      {text:"ペムダ",type:"niibura",intensity:2},{text:"ゴベリン",type:"niibura",intensity:2},
      {text:"ヌポコ",type:"niibura",intensity:3},{text:"ダメコ",type:"niibura",intensity:2},
      {text:"ブロニャ",type:"niibura",intensity:3},{text:"メダコン",type:"niibura",intensity:2},
      {text:"ゾペラ",type:"niibura",intensity:2},
    ],
    fake_french: [
      {text:"ブランシュヴォ",type:"fake_french",intensity:3},{text:"ブォルデナール",type:"fake_french",intensity:3},
      {text:"モンプゥルヴァ",type:"fake_french",intensity:3},{text:"トゥネルボワ",type:"fake_french",intensity:3},
      {text:"ブルデモントゥ",type:"fake_french",intensity:3},{text:"トゥルシュヴァ",type:"fake_french",intensity:3},
      {text:"ブランヴォネール",type:"fake_french",intensity:3},{text:"シュルヴァネ",type:"fake_french",intensity:3},
      {text:"ヴァルネシュ",type:"fake_french",intensity:3},{text:"モントゥルボァ",type:"fake_french",intensity:3},
      {text:"トゥレモンシュ",type:"fake_french",intensity:3},{text:"ブレモンドゥァ",type:"fake_french",intensity:3},
      {text:"フェンルボァ",type:"fake_french",intensity:3},{text:"セトゥルバーヌ",type:"fake_french",intensity:3},
      {text:"フェルモンシュ",type:"fake_french",intensity:3},{text:"フェドランヴァ",type:"fake_french",intensity:3},
      {text:"フェランシュボ",type:"fake_french",intensity:3},{text:"セトゥモンシュ",type:"fake_french",intensity:3},
      {text:"ブォルヴァシュ",type:"fake_french",intensity:3},{text:"フェヴランドゥボ",type:"fake_french",intensity:3},
      {text:"セュルブォネ",type:"fake_french",intensity:3},{text:"ヴォルデュシュ",type:"fake_french",intensity:3},
      {text:"フェボランシュ",type:"fake_french",intensity:3},{text:"セドゥルヴォァ",type:"fake_french",intensity:3},
      {text:"ブォヴランシュ",type:"fake_french",intensity:3},
    ],
    templates: [
      {template:"___っと___する",slots:["sound_a","sound_b"]},
      {template:"___の___感",slots:["sound_a","sound_b"]},
      {template:"___くて___い",slots:["sound_a","sound_b"]},
      {template:"___がって___った",slots:["sound_a","sound_b"]},
      {template:"___な___じゃん",slots:["sound_a","sound_b"]},
    ],
  };

  const SLOT_SUGGESTIONS = {
    sound_a:["サピーン","ズッキャ","ニュヴァ","ピャキ","ゲュム","ヌォ","ジュワキ","ズォッ","ピュギャ","ゲニャ"],
    sound_b:["スュク","ジョヴィ","ブュン","ゾュッ","ペュキ","ニュキャ","ズィッ","グャム","シュポヴ","ヴュク"],
  };

  // ミックス対象カテゴリ（PHRASES に実在するキーのみ）
  const MIX_CATS = ['single_sounds','repeated_sounds','sound_phrases','fragments','niibura','fake_french'];

  // ============================================================
  // ユーティリティ
  // ============================================================
  const $ = id => document.getElementById(id);

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ミックスキュー：同カテゴリ連続を避けてランダムに並べる
  function buildMixQueue() {
    const pools = {};
    MIX_CATS.forEach(cat => { pools[cat] = shuffle([...PHRASES[cat]]); });

    const result = [];
    const remaining = {};
    MIX_CATS.forEach(c => { remaining[c] = pools[c].length; });
    const total = Object.values(remaining).reduce((a, b) => a + b, 0);
    let lastCat = null;

    for (let i = 0; i < total; i++) {
      const available = MIX_CATS.filter(c => remaining[c] > 0 && c !== lastCat);
      if (available.length === 0) break;
      const cat = available[Math.floor(Math.random() * available.length)];
      result.push(pools[cat][--remaining[cat]]);
      lastCat = cat;
    }
    return result.reverse(); // popで取り出すため逆順
  }

  // カテゴリキーからキューを作る（'mix' は buildMixQueue を使う）
  function buildQueue(cat) {
    if (cat === 'mix') return buildMixQueue();
    if (!PHRASES[cat]) return buildMixQueue(); // フォールバック
    return shuffle([...PHRASES[cat]]);
  }

  // ============================================================
  // 音声読み上げ（Web Speech API）
  // ============================================================
  const synth = window.speechSynthesis || null;

  // speak(): iOS Safari / Chrome 両対応の実装
  //
  // iOS Safari の制約:
  //   - synth.speak() はユーザー操作のイベントハンドラを
  //     「同期的に抜ける前」に呼ばなければならない
  //   - setTimeout の中で呼ぶと「ユーザー操作起因」と判定されず無音になる
  //   - そのため cancel() → 即 speak() をすべて同期で行う
  //
  // Chrome の cancel直後speak()無視バグへの対応:
  //   - cancel() を呼ばずに新しい utterance を speak() するだけで上書きされる
  //   - Chrome は後からキューに積んだ utterance を優先するため問題ない
  //
  // 結論: cancel() を使わず、speak() だけ呼ぶ。
  //   - iOS: 同期呼び出しなので制約を満たす
  //   - Chrome: キューが積み上がることがあるので、speaking中なら一度cancelしてから即speak
  function speakText(text, btn) {
    if (!synth) return;

    // Chrome長時間放置でpausedになる既知バグ対策
    if (synth.paused) synth.resume();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang   = 'ja-JP';
    utter.rate   = 0.75;
    utter.pitch  = 0.8;
    utter.volume = 1.0;

    // 日本語voiceを明示指定（iOS/Androidで lang だけでは動かない機種への対応）
    // getVoices() は初回空の場合があるが、iOSは同期的に取得できることが多い
    const voices = synth.getVoices();
    const jaVoice = voices.find(v => v.lang === 'ja-JP') ||
                    voices.find(v => v.lang.startsWith('ja'));
    if (jaVoice) utter.voice = jaVoice;

    utter.onstart = () => { if (btn) btn.classList.add('speaking'); };
    utter.onend   = () => { if (btn) btn.classList.remove('speaking'); };
    utter.onerror = (e) => {
      if (e.error !== 'interrupted') console.warn('speech error:', e.error);
      if (btn) btn.classList.remove('speaking');
    };

    // すでに喋っている場合のみ cancel → 即 speak（setTimeoutは使わない）
    if (synth.speaking) synth.cancel();
    synth.speak(utter);
  }

  function stopSpeak() {
    if (!synth) return;
    synth.cancel();
    const btn = $('btn-speak');
    if (btn) btn.classList.remove('speaking');
  }

  // voices は非同期でロードされる。voiceschanged イベントで再取得できるよう登録
  if (synth && synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = () => { /* 取得はspeakText内のgetVoices()に委譲 */ };
  }

  // ============================================================
  // 状態
  // ============================================================
  const state = {
    read: {
      category: 'mix',
      queue: [],
      score: 0,
      streak: 0,
      maxStreak: 0,
      awaitingReaction: false,
      current: null,
    },
    create: {
      templateIndex: -1,
      current: null,
      selections: {},
      score: 0,
    },
  };

  // ============================================================
  // スクリーン遷移
  // ============================================================
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  $('btn-read').onclick   = () => { showScreen('read');   initRead(); };
  $('btn-create').onclick = () => { showScreen('create'); initCreate(); };
  $('read-back').onclick  = () => { stopSpeak(); showScreen('title'); };
  $('create-back').onclick = () => showScreen('title');

  // ============================================================
  // 読むモード
  // ============================================================
  function initRead() {
    const r = state.read;
    r.queue = buildQueue(r.category);
    r.awaitingReaction = false;

    $('reaction-area').style.display = 'none';
    $('btn-speak').style.display = 'none';
    $('phrase-text').textContent = 'タップ';
    $('phrase-hint').textContent = 'カードをタップしてスタート';
    $('phrase-type').textContent = '';
    $('phrase-card').classList.remove('showing', 'entering', 'zowa-flash');
    stopSpeak();
  }

  // カテゴリタブ
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.read.category = tab.dataset.cat;
      initRead(); // initRead内でbuildQueue(r.category)を呼ぶ
    };
  });

  // カードタップ
  $('phrase-card').onclick = () => {
    if (!state.read.awaitingReaction) nextPhrase();
  };

  function nextPhrase() {
    const r = state.read;
    if (r.queue.length === 0) r.queue = buildQueue(r.category);

    const phrase = r.queue.pop();
    r.current = phrase;
    r.awaitingReaction = false;

    const card = $('phrase-card');
    card.classList.remove('entering');
    void card.offsetWidth;
    card.classList.add('showing', 'entering');

    $('phrase-text').textContent = phrase.text;
    $('phrase-hint').textContent = '声に出して読んでみよう';

    const labels = {
      single: '単発造語', repeat: '繰り返し', phrase: '造語フレーズ',
      fragment: '音の破片', niibura: 'ニーブラ系', fake_french: '假フランス語',
    };
    $('phrase-type').textContent = labels[phrase.type] || '';

    const speakBtn = $('btn-speak');
    speakBtn.style.display = 'flex';
    speakBtn.dataset.phrase = phrase.text;
    stopSpeak();

    setTimeout(() => {
      $('reaction-area').style.display = 'flex';
      r.awaitingReaction = true;
    }, 600);
  }

  // 聴くボタン（必ずユーザー操作 onclick 内で speakText を呼ぶ）
  $('btn-speak').onclick = function(e) {
    e.stopPropagation();
    const btn = this; // onclick内でthisを使いボタン参照を確保
    if (btn.classList.contains('speaking')) {
      stopSpeak();
    } else {
      speakText(btn.dataset.phrase, btn);
    }
  };

  // 反応ボタン
  document.querySelectorAll('#reaction-area .btn-reaction').forEach(btn => {
    btn.onclick = () => {
      const val = parseInt(btn.dataset.val, 10);
      const r = state.read;
      if (!r.current) return;

      r.score += val * (r.current.intensity || 1);
      const scoreEl = $('read-score');
      scoreEl.textContent = r.score;
      scoreEl.classList.remove('score-pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('score-pop');

      if (val >= 2) { r.streak++; if (r.streak > r.maxStreak) r.maxStreak = r.streak; }
      else r.streak = 0;
      $('streak-count').textContent = r.streak;
      $('streak-max').textContent = '最高 ' + r.maxStreak;

      triggerZowa(val);
      $('reaction-area').style.display = 'none';
      r.awaitingReaction = false;

      const card = $('phrase-card');
      card.classList.add('zowa-flash');
      setTimeout(() => card.classList.remove('zowa-flash'), 800);
    };
  });

  $('btn-next-read').onclick = () => {
    $('reaction-area').style.display = 'none';
    state.read.awaitingReaction = false;
    nextPhrase();
  };
  $('btn-skip-read').onclick = () => {
    $('reaction-area').style.display = 'none';
    state.read.awaitingReaction = false;
    state.read.streak = 0;
    $('streak-count').textContent = 0;
    nextPhrase();
  };

  // ============================================================
  // 作るモード
  // ============================================================
  function initCreate() {
    state.create.templateIndex = -1;
    state.create.selections = {};
    state.create.score = 0;
    $('create-score').textContent = 0;
    $('create-reaction-area').style.display = 'none';
    nextTemplate();
  }

  function nextTemplate() {
    const c = state.create;
    const templates = PHRASES.templates;
    c.templateIndex = (c.templateIndex + 1) % templates.length;
    c.current = templates[c.templateIndex];
    c.selections = {};
    $('template-text').textContent = c.current.template;
    renderSlots();
    updatePreview();
  }

  function renderSlots() {
    const c = state.create;
    const area = $('slots-area');
    area.innerHTML = '';
    const slotLabels = { sound_a: 'パーツ A', sound_b: 'パーツ B' };
    c.current.slots.forEach((slotType, idx) => {
      const group = document.createElement('div');
      group.className = 'slot-group';
      const label = document.createElement('p');
      label.className = 'slot-label';
      label.textContent = (idx + 1) + '. ' + (slotLabels[slotType] || slotType);
      group.appendChild(label);
      const chips = document.createElement('div');
      chips.className = 'slot-chips';
      (SLOT_SUGGESTIONS[slotType] || []).forEach(word => {
        const chip = document.createElement('button');
        chip.className = 'slot-chip';
        chip.textContent = word;
        chip.dataset.slot = idx;
        chip.dataset.word = word;
        chip.onclick = () => {
          chips.querySelectorAll('.slot-chip').forEach(ch => ch.classList.remove('selected'));
          chip.classList.add('selected');
          c.selections[idx] = word;
          updatePreview();
          triggerZowa(1);
        };
        chips.appendChild(chip);
      });
      group.appendChild(chips);
      area.appendChild(group);
    });
  }

  function updatePreview() {
    const c = state.create;
    let text = c.current.template;
    let allFilled = true;
    c.current.slots.forEach((_, idx) => {
      if (c.selections[idx]) text = text.replace('___', c.selections[idx]);
      else allFilled = false;
    });
    const el = $('preview-text');
    const card = $('preview-card');
    if (Object.keys(c.selections).length === 0) {
      el.textContent = '—— 上から選んで完成させよう ——';
      el.classList.add('placeholder');
      card.classList.remove('ready');
      $('create-reaction-area').style.display = 'none';
    } else {
      el.textContent = text;
      el.classList.remove('placeholder');
      if (allFilled) {
        card.classList.add('ready');
        $('create-reaction-area').style.display = 'flex';
      } else {
        card.classList.remove('ready');
        $('create-reaction-area').style.display = 'none';
      }
    }
  }

  $('btn-new-template').onclick = () => {
    $('create-reaction-area').style.display = 'none';
    nextTemplate();
  };
  $('btn-shuffle-slots').onclick = () => {
    const c = state.create;
    c.current.slots.forEach((slotType, idx) => {
      const sugs = SLOT_SUGGESTIONS[slotType] || [];
      if (sugs.length) c.selections[idx] = sugs[Math.floor(Math.random() * sugs.length)];
    });
    document.querySelectorAll('.slot-chip').forEach(chip => {
      chip.classList.toggle('selected', c.selections[parseInt(chip.dataset.slot, 10)] === chip.dataset.word);
    });
    updatePreview();
    triggerZowa(1);
  };

  document.querySelectorAll('.create-react').forEach(btn => {
    btn.onclick = () => {
      const val = parseInt(btn.dataset.val, 10);
      state.create.score += val * 2;
      const scoreEl = $('create-score');
      scoreEl.textContent = state.create.score;
      scoreEl.classList.remove('score-pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('score-pop');
      triggerZowa(val);
      $('create-reaction-area').style.display = 'none';
      setTimeout(() => nextTemplate(), 1200);
    };
  });

  // ============================================================
  // ぞわっとエフェクト
  // ============================================================
  function triggerZowa(intensity) {
    const ripple = $('zowa-ripple');
    ripple.classList.remove('animate-1', 'animate-2', 'animate-3');
    void ripple.offsetWidth;
    ripple.classList.add('animate-' + intensity);
    if (intensity >= 3) {
      document.body.classList.remove('shake');
      void document.body.offsetWidth;
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 700);
    }
    setTimeout(() => ripple.classList.remove('animate-1', 'animate-2', 'animate-3'), 1500);
  }
  </script>
